<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Abhinandan Kumar Dwivedi-Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="fade-in">
        <img src="myphoto.jpg" alt="Abhinandan" class="profile-pic">
        <h1 class="typing">Abhinandan Kumar Dwivedi</h1>
        <p>CSE Student | Future Software Engineer 🚀</p>
        <button class="mode-btn" onclick="toggleMode()" id="modeToggle">
            🌙 Dark Mode
        </button>
    </header>

    <section class="card slide-up">
        <h2>About Me</h2>
        <p>This is the official portfolio website of Abhinandan Kumar Dwivedi. 
        I am a CSE student and aspiring software developer.</p>
    </section>

    <section class="card slide-up">
        <h2>Skills</h2>
        <ul>
            <li>HTML & CSS</li>
            <li>JavaScript</li>
            <li>C Programming</li>
            <li>Problem Solving</li>
        </ul>
    </section>

    <section class="card slide-up" id="login-section">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </section>

    <section class="card slide-up" id="contact-section">
        <h2>Contact Me</h2>
        <!-- अपडेटेड कांटेक्ट फॉर्म -->
        <form action="https://formspree.io/f/xnjybloj" method="POST">
            <input type="text" name="name" placeholder="Enter your Name" required>
            <input type="text" name="subject" placeholder="Enter your subject"> 
            <inout type="tel" name="mobile" placeholder="+91 XXXXXXXXXX" pattern="\+91[6-9][0-9]{9}" title="Please Enter Your 10 Digit Number With Country Code(+91)" required>
            <input type="email" name="email" placeholder="Enter your Email" required>
            <textarea name="message" placeholder="Type your message..." required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
